[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-audit-trail"
version = "0.1.0"
description = "Tamper-evident audit trail for AI decisions: hash-chained append-only log, verify command, queries, redaction, CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anusha Mukka" }]
keywords = ["audit", "ai-governance", "tamper-evident", "hash-chain", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/ai-audit-trail"

[project.scripts]
audit-trail = "ai_audit_trail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
